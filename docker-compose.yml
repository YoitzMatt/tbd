services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pubsub
      POSTGRES_PASSWORD: pubsub
      POSTGRES_DB: pubsub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pubsub -d pubsub"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
